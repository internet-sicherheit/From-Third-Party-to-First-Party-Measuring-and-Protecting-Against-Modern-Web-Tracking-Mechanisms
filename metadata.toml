use = """
Intended use: The artifact supports (i) reproduction of the paper's
analysis pipeline -- first-party tracking (FPT) cookie detection via the
four-criterion heuristic, SimHash-based JavaScript clustering, entity
attribution, and filter-list rule generation -- on the frozen crawl
dataset collected for the paper, and (ii) reuse of the individual
pipeline components (heuristic, clustering, rule generator) as baselines
or building blocks in future web-measurement research.

Limitations / not suitable for:
(1) Re-crawling: the artifact does not reproduce the data collection
itself. Crawl results depend on time, vantage point, and site-side
changes; re-running the crawler will yield different raw data. All
quantitative claims are therefore evaluated against the included frozen
dataset.
(2) Production ad-blocking: the 181 generated filter-list rules are a
research prototype. They have not undergone the review process of
filter-list maintainers and should not be deployed to end users without
independent breakage testing.
(3) Compliance or legal assessment: a cookie flagged by the heuristic
indicates tracking *capability* under our criteria (C1-C4), not a legal
determination (e.g., under GDPR/ePrivacy) about a specific site or
operator. The artifact must not be used to make claims about individual
sites' legal compliance.
(4) Session-management edge cases: as discussed in the paper (Table 5),
cookies such as PHPSESSID and AWSALB can satisfy the heuristic despite
legitimate origins; per-cookie classifications should not be interpreted
as intent attribution.

Data-specific limitations: the dataset is a snapshot; site behavior,
cookies, and scripts observed reflect the collection period documented
in docs/provenance.md and will differ from current web state. The
dataset contains no personal data of end users; crawls were performed
with fresh, stateless browser profiles.

Column schemas for every file the claim scripts read or write are
documented in docs/schema.md.
"""
destructive = "None. The artifact operates offline on the included frozen dataset. All writes are confined to the container / a mounted output volume. No live web requests, no scanning, no modification of the host system outside the working directory."
